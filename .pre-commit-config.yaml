repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  - repo: local
    hooks:
      # Same checks as CI's "Agent files and no em/en dashes" step.
      - id: agent-files
        name: Agent files load and resolve
        entry: python3 scripts/check_agent_files.py --check
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: no-dashes
        name: No em or en dashes
        entry: python3 scripts/check_no_dashes.py --check
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        stages: [pre-commit]
        pass_filenames: false
        types: [ts]
      - id: prettier
        name: Prettier format check
        entry: npm run format:check
        language: system
        stages: [pre-commit]
        pass_filenames: false
        types: [ts]

      # Secret scanning at PUSH time. This extension ships on the VS Code
      # Marketplace and the repo is public, so a credential reaching main is
      # world-readable at once. CI scans too (.github/workflows/secret-scan.yml);
      # this catches it before the push, while the commit can still be amended
      # instead of the credential rotated.
      - id: gitleaks-push
        name: Secret scan the commits being pushed (gitleaks)
        entry: scripts/hooks/gitleaks-push.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

# A hook with no `stages` runs at every stage, so the hooks above are pinned to
# pre-commit and the scan to pre-push.
default_install_hook_types: [pre-commit, pre-push]
